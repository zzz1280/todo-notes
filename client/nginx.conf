server {
    listen 80;

    # 前端是单页应用（SPA）：刷新 /login 这类路由时，
    # 服务器上并没有这个文件，统一回退到 index.html 交给前端路由接管
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 请求转发给后端容器：server 是 docker-compose 里后端服务的名字，
    # Docker 内部网络会自动把它解析成后端容器的 IP
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查同样转发
    location /health {
        proxy_pass http://server:3001;
    }
}
